services:
  lilycam:
    build: .
    image: lilycam:latest
    container_name: lilycam
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: "8790"
      IDLE_SECS: "180"
      # trần phiên: quá 12 thì đuổi phiên lâu nhất, tránh 10 ô + HD làm CPU vọt
      MAX_STREAMS: "12"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"   # GID của nhóm render trên máy này (getent group render)
    volumes:
      - ./data:/app/data
      - ${HOME}/.lark-cli:/root/.lark-cli
      - ${HOME}/.local/share/lark-cli:/root/.local/share/lark-cli
