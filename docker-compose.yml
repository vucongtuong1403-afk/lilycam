services:
  lilycam:
    build: .
    image: lilycam:latest
    container_name: lilycam
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: "8790"
      # trần phiên: quá 12 thì đuổi phiên lâu nhất, tránh 10 ô + HD làm CPU vọt
      MAX_STREAMS: "12"
      # không ai xem quá 90 s thì tắt ffmpeg của kênh đó (trước đây 180 s và chỉ
      # được dọn khi có request nên phiên treo hàng chục phút → CPU 90°C)
      IDLE_SECS: "90"
      # watchdog nhiệt: ≥ 80°C thì giữ tối đa 2 phiên, hạ dưới 65°C thì thôi
      TEMP_HOT: "80"
      TEMP_COOL: "65"
      # giải mã + mã hoá bằng GPU Intel (VAAPI). Đặt "0" nếu máy không có GPU
      VAAPI: "1"
      VAAPI_DEV: /dev/dri/renderD128
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"   # GID của nhóm render trên máy này (getent group render)
    volumes:
      - ./data:/app/data
      - ./public:/app/public   # sửa giao diện không cần build lại image
      - ${HOME}/.lark-cli:/root/.lark-cli
      - ${HOME}/.local/share/lark-cli:/root/.local/share/lark-cli
