services:
  lilycam:
    build: .
    image: lilycam:latest
    container_name: lilycam
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: "8790"
      IDLE_SECS: "180"
    volumes:
      - ./data:/app/data
      # token Lark (để nút Chụp ảnh ghi được lên Giám sát tháng)
      - ${HOME}/.lark-cli:/root/.lark-cli
      - ${HOME}/.local/share/lark-cli:/root/.local/share/lark-cli
