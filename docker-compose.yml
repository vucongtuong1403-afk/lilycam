services:
  lilycam:
    build: .
    image: lilycam:latest
    container_name: lilycam
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8790:8790"
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: "8790"
      # container chạy uid 1000 nên KHÔNG đọc được /root; đặt HOME=/app để
      # lark-cli tìm thấy cấu hình ở /app/.lark-cli + /app/.local/share/lark-cli
      HOME: /app
      # trần phiên: đủ 10 ô lưới + 1 luồng xem + dự phòng. Đầy thì ô mới báo "Chưa có"
      # thay vì đuổi phiên vừa mở (trước đây đuổi–mở vòng tròn, 1.200 lần mở/3 giờ).
      MAX_STREAMS: "14"
      # không ai xem quá 120 s thì tắt ffmpeg của kênh đó
      IDLE_SECS: "120"
      # ffmpeg của kênh chết sớm thì khoá kênh 20 s, không spawn lại liên tục
      FAIL_BACKOFF: "20"
      # watchdog nhiệt: chỉ cắt phiên khi ≥ 80°C suốt 30 s (3 mẫu), hạ dưới 65°C thì thôi
      TEMP_HOT: "80"
      TEMP_COOL: "65"
      # giải mã + mã hoá bằng GPU Intel (VAAPI). Đặt "0" nếu máy không có GPU
      VAAPI: "1"
      VAAPI_DEV: /dev/dri/renderD128
    # Chặn container kéo cả máy vào OOM: 17/11 kernel đã giết 44 lần (shmem/GPU lên
    # 27 GB), làm mất cả pipewire/gnome-shell → máy lag rồi tự khởi động lại.
    mem_limit: 6g
    memswap_limit: 6g
    shm_size: 512m
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"   # GID của nhóm render trên máy này (getent group render)
    volumes:
      - ./data:/app/data
      - ./public:/app/public   # sửa giao diện không cần build lại image
      - ${HOME}/.lark-cli:/app/.lark-cli
      - ${HOME}/.local/share/lark-cli:/app/.local/share/lark-cli
